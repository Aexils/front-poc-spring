<div class="container">
  <h2 class="dashboard-title">Utilisateurs</h2>

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
    <!-- Picture Column -->
    <ng-container matColumnDef="picture">
      <th mat-header-cell *matHeaderCellDef> Avatar</th>
      <td mat-cell *matCellDef="let user">
        <img [src]="user.picture" alt="avatar" width="32" height="32" style="border-radius: 50%;"/>
      </td>
    </ng-container>

    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Nom</th>
      <td mat-cell *matCellDef="let user"> {{ user.name }}</td>
    </ng-container>

    <!-- Email Column -->
    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef> Email</th>
      <td mat-cell *matCellDef="let user"> {{ user.email }}</td>
    </ng-container>

    <!-- Role Column -->
    <ng-container matColumnDef="role">
      <th mat-header-cell *matHeaderCellDef> Role</th>
      <td mat-cell *matCellDef="let user"> {{ user.role }}</td>
    </ng-container>

    <!-- CreatedAt Column -->
    <ng-container matColumnDef="createdAt">
      <th mat-header-cell *matHeaderCellDef> Créé le</th>
      <td mat-cell *matCellDef="let user"> {{ user.createdAt | date:'short' }}</td>
    </ng-container>

    <ng-container matColumnDef="settings">
      <th mat-header-cell *matHeaderCellDef> Réglage</th>
      <td mat-cell *matCellDef="let user">
        <button class="btn btn-primary" (click)="openModal(user)">
          <i class="bi bi-gear"></i>
        </button>
      </td>
    </ng-container>

    <!-- Header and Row Definitions -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>

@if (userForm) {
  <app-modal
    [title]="modalTitle"
    [show]="modalVisible"
    (close)="closeModal()"
    (confirm)="onSubmit()"
  >
    <form [formGroup]="userForm" (ngSubmit)="onSubmit()">

      <div class="form-group mb-3">
        <label for="userId">ID</label>
        <input type="text" class="form-control" formControlName="id" id="userId" readonly>
      </div>

      <div class="form-group mb-3">
        <label for="userEmail">Email</label>
        <input type="email" class="form-control" formControlName="email" id="userEmail">
      </div>

      <div class="form-group mb-3">
        <label for="userName">Name</label>
        <input type="text" class="form-control" formControlName="name" id="userName">
      </div>

      <div class="form-group mb-3">
        <label class="d-block">Role</label>
        <div class="form-check form-check-inline">
          <input
            class="form-check-input"
            type="radio"
            id="radioAdmin"
            formControlName="role"
            value="ADMIN"
          />
          <label class="form-check-label" for="radioAdmin">ADMIN</label>
        </div>

        <div class="form-check form-check-inline">
          <input
            class="form-check-input"
            type="radio"
            id="radioGuest"
            formControlName="role"
            value="GUEST"
          />
          <label class="form-check-label" for="radioGuest">GUEST</label>
        </div>
      </div>

      <div class="form-group mb-3">
        <label for="userPicture">Picture URL</label>
        <input type="text" class="form-control" formControlName="picture" id="userPicture">
      </div>

      <div class="form-group mb-3">
        <label class="d-block">Active</label>
        <div class="form-check form-check-inline">
          <input
            class="form-check-input"
            type="radio"
            id="radioIsActive"
            formControlName="active"
            [value]="true"
          />
          <label class="form-check-label" for="radioIsActive">True</label>
        </div>

        <div class="form-check form-check-inline">
          <input
            class="form-check-input"
            type="radio"
            id="radioNotActive"
            formControlName="active"
            [value]="false"
          />
          <label class="form-check-label" for="radioNotActive">False</label>
        </div>
      </div>

    </form>
  </app-modal>
}
