<h3>Variantes</h3>

<div *ngFor="let variant of variants">
  <div>
    <strong>{{ variant.variantName }}</strong> – {{ variant.priceOverride }} €
    / Stock : {{ variant.stock }} / Actif : {{ variant.active ? '✅' : '❌' }}
    <button (click)="remove(variant.id)">❌</button>
  </div>
</div>

<input [(ngModel)]="newVariant.variantName" placeholder="Nom de la variante" />
<input type="number" [(ngModel)]="newVariant.priceOverride" placeholder="Prix spécifique" />
<input type="number" [(ngModel)]="newVariant.stock" placeholder="Stock" />
<label>
  Actif :
  <input type="checkbox" [(ngModel)]="newVariant.active" />
</label>
<button (click)="add()">Ajouter</button>
