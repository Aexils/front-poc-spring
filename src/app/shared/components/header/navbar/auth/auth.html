@if (user()) {
  <button mat-icon-button [matMenuTriggerFor]="menu">
    <img [src]="user()?.picture" width="32" height="32" style="border-radius: 50%" alt=""/>
  </button>

  <mat-menu #menu="matMenu">
    <button mat-menu-item disabled>{{user()?.email}}</button>
    <button mat-menu-item (click)="logout()">Déconnexion</button>
  </mat-menu>
} @else {
  <button mat-raised-button color="accent" (click)="login()">Connexion</button>
}
